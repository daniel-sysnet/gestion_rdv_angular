<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0">Créer mon Compte Patient</h4>
        </div>
        <div class="card-body p-4">
            <form>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Prénom</label>
                        <input type="text" class="form-control" placeholder="Ex: Moussa">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nom</label>
                        <input type="text" class="form-control" placeholder="Ex: Diop">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Adresse Email</label>
                        <input type="email" class="form-control" placeholder="nom@exemple.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Numéro de Téléphone</label>
                        <input type="tel" class="form-control" placeholder="+221 ...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date de Naissance</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-2" routerLink="/public/login">Enregistrer mes informations</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
