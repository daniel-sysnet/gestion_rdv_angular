<div class="container-fluid py-4">
    <div class="row">
        <div class="col-md-12">
            <h1 class="mb-4"><i class="bi bi-list-check"></i> Gestion des Demandes RV</h1>

            <!-- Tabs Navigation -->
            <ul class="nav nav-tabs mb-4" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pending-tab" data-bs-toggle="tab" data-bs-target="#pending" type="button" role="tab">
                        <i class="bi bi-clock"></i> En attente
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="accepted-tab" data-bs-toggle="tab" data-bs-target="#accepted" type="button" role="tab">
                        <i class="bi bi-check-circle"></i> Acceptées
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="rejected-tab" data-bs-toggle="tab" data-bs-target="#rejected" type="button" role="tab">
                        <i class="bi bi-x-circle"></i> Refusées
                    </button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Pending Requests -->
                <div class="tab-pane fade show active" id="pending" role="tabpanel">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Patient</th>
                                    <th>Spécialité</th>
                                    <th>Date Demandée</th>
                                    <th>Statut</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>Jean Dupont</strong></td>
                                    <td>Cardiologue</td>
                                    <td>25/01/2026</td>
                                    <td><span class="badge bg-warning">En attente</span></td>
                                    <td>
                                        <button class="btn btn-sm btn-primary"><i class="bi bi-check"></i> Accepter</button>
                                        <button class="btn btn-sm btn-danger"><i class="bi bi-x"></i> Refuser</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td><strong>Marie Martin</strong></td>
                                    <td>Dermatologue</td>
                                    <td>26/01/2026</td>
                                    <td><span class="badge bg-warning">En attente</span></td>
                                    <td>
                                        <button class="btn btn-sm btn-primary"><i class="bi bi-check"></i> Accepter</button>
                                        <button class="btn btn-sm btn-danger"><i class="bi bi-x"></i> Refuser</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Accepted Requests -->
                <div class="tab-pane fade" id="accepted" role="tabpanel">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Patient</th>
                                    <th>Spécialité</th>
                                    <th>Date Confirmée</th>
                                    <th>Heure</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>Pierre Bernard</strong></td>
                                    <td>ORL</td>
                                    <td>20/01/2026</td>
                                    <td>10:00</td>
                                    <td>
                                        <button class="btn btn-sm btn-info"><i class="bi bi-eye"></i> Détails</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Rejected Requests -->
                <div class="tab-pane fade" id="rejected" role="tabpanel">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> Aucune demande refusée
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
