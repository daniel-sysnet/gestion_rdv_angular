<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-calendar-plus"></i> Nouvelle Demande de Rendez-vous</h5>
        </div>
        <div class="card-body">
            <form (submit)="$event.preventDefault()">
                <div class="mb-3">
                    <label class="form-label">Spécialité médicale</label>
                    <select class="form-select">
                        <option value="" disabled selected>Choisissez une spécialité</option>
                        @for (spec of specialites; track spec) {
                            <option [value]="spec">{{ spec }}</option>
                        }
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Date souhaitée</label>
                    <input type="date" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Heure souhaitée</label>
                    <input type="time" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Motif (Optionnel)</label>
                    <textarea class="form-control" rows="3" placeholder="Décrivez brièvement votre besoin..."></textarea>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        Envoyer la demande
                    </button>
                    <button type="button" class="btn btn-secondary" routerLink="/private/dash">
                        Annuler
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
